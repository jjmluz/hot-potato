name: CI

# Every push and pull request is linted and built.
# Pushing a tag like v1.2.0 also publishes a GitHub release with the APK.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image already has the Android SDK; Gradle downloads any missing platform itself.
      - uses: gradle/actions/setup-gradle@v6

      - name: Check question files
        working-directory: android/app/src/main/assets
        run: |
          # Every line needs exactly 6 tab-separated, non-empty fields.
          bad=0
          for f in */*.tsv; do
            awk -F'\t' -v f="$f" 'NF != 6 { printf "%s:%d: %d fields\n", f, NR, NF; bad = 1 }
              { for (i = 1; i <= NF; i++) if ($i == "") { printf "%s:%d: empty field %d\n", f, NR, i; bad = 1 } }
              END { exit bad }' "$f" || bad=1
          done
          exit $bad

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Without the secrets (pull requests from forks, for example) the build falls back to the debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets; the APK is signed with a throwaway debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "hot-potato-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: android/hot-potato-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: android/app/build/reports/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Create GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hot-potato-*.apk --repo "$GITHUB_REPOSITORY" --title "Hot Potato ${GITHUB_REF_NAME#v}" --generate-notes
